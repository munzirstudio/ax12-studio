orientation: normal
rows: 3
columns: 4
knobs: 2
layers:
  - buttons:
      - - v
        - f
        - r
        - p
      - - t
        - shift-a
        - opt-cmd-k
        - cmd-g
      - - opt-cmd-c
        - opt-cmd-v
        - shift-h
        - cmd-d
    knobs:
      - ccw: cmd-minus
        press: shift-1
        cw: cmd-equal
      - ccw: cmd-leftbracket
        press: cmd-slash
        cw: cmd-rightbracket
  - buttons:
      - - opt-w
        - opt-v
        - opt-a
        - opt-d
      - - shift-cmd-g
        - opt-cmd-g
        - shift-cmd-h
        - shift-cmd-l
      - - shift-cmd-r
        - shift-cmd-c
        - shift-cmd-e
        - shift-delete
    knobs:
      - ccw: shift-n
        press: shift-2
        cw: "n"
      - ccw: ctrl-opt-h
        press: ctrl-opt-t
        cw: ctrl-opt-v
  - buttons:
      - - cmd-b
        - cmd-i
        - cmd-u
        - shift-cmd-x
      - - opt-cmd-l
        - opt-cmd-t
        - opt-cmd-r
        - cmd-k
      - - shift-cmd-8
        - shift-cmd-7
        - shift-cmd-comma
        - shift-cmd-dot
    knobs:
      - ccw: shift-cmd-comma
        press: cmd-0
        cw: shift-cmd-dot
      - ccw: opt-shift-comma
        press: cmd-backslash
        cw: opt-shift-dot
